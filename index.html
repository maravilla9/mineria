<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El anaquel inteligente | Semana 4</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#07B708; --verde-d:#058A06; --tinta:#1F2433; --suave:#6B7280; --fondo:#F4F7F2;
  --naranja:#F07B00; --rosa:#D6338A; --turq:#0E9C94; --morado:#7B2FD0; --amarillo:#E0A100; --azul:#2E7DD7; --rojo:#D62828;
  --noche:#101A2E; --noche2:#1A2742;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--fondo);color:var(--tinta);min-height:100vh;font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding:10px 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header img{height:34px}
.top{display:flex;gap:10px;align-items:center;flex:1;min-width:200px}
.timer{font-weight:700;background:#fff;border-radius:12px;padding:5px 10px;box-shadow:0 2px 8px rgba(0,0,0,.06);font-variant-numeric:tabular-nums}
.bar{flex:1;height:10px;background:#E3E8E0;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--verde),var(--turq));transition:width .6s}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:99px;color:#fff}
.b1{background:var(--rosa)} .b2{background:var(--morado)}
.steps{display:none;gap:6px;margin:8px 0;flex-wrap:wrap}
.steps span{flex:1;min-width:110px;text-align:center;font-size:11.5px;font-weight:700;padding:5px 4px;border-radius:10px;background:#E6EAE3;color:#8A9187;transition:all .3s}
.steps span.on{background:var(--morado);color:#fff}
.steps span.ok{background:#DDF5DD;color:var(--verde-d)}
.card{background:#fff;border-radius:16px;padding:14px 18px;box-shadow:0 6px 24px rgba(16,26,46,.08);animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:24px;margin:0 0 4px;line-height:1.2}
h2{font-size:19px;margin:0 0 2px}
.mis{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
p{line-height:1.45;margin:5px 0}
.story{background:#FFF4E6;border-left:5px solid var(--naranja);border-radius:12px;padding:9px 13px;margin:8px 0}
.guia{background:#E8F1FD;border-left:5px solid var(--azul);border-radius:12px;padding:7px 12px;margin:7px 0;font-size:13.5px;color:#1E3F6E}
.guia b{color:#123058}
input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:2px solid #D6DCD2;border-radius:12px;outline:none}
input[type=text]:focus{border-color:var(--verde)}
.btn{font:inherit;font-weight:700;font-size:14.5px;border:0;border-radius:11px;padding:10px 18px;cursor:pointer;background:var(--verde);color:#fff;transition:transform .1s,background .2s;text-decoration:none;display:inline-block;text-align:center}
.btn:active{transform:scale(.97)} .btn:hover{background:var(--verde-d)}
.btn.sec{background:#EEF1EC;color:var(--tinta)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;align-items:center}
.msg{margin-top:8px;border-radius:12px;padding:8px 12px;font-size:13.5px;display:none}
.msg.ojo{display:block;background:#FDE8E8;color:#8E1B1B;border-left:5px solid var(--rojo)}
.msg.bien{display:block;background:#E3F7E3;color:#145A14;border-left:5px solid var(--verde)}
.why{font-style:italic;color:#6B7280;font-size:13px;margin-top:4px;line-height:1.45}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:6px}
.opt{text-align:left;border:2px solid #D6DCD2;background:#fff;border-radius:12px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;transition:all .15s}
.opt:hover{border-color:var(--morado)}
.opt.pick{border-color:var(--morado);background:#EDE3FA;box-shadow:0 0 0 3px rgba(123,47,208,.15)}
.opt.pick::before{content:"👉 "}
.opt.sel{border-color:var(--verde);background:#EAF9EA}
.cnt{font-weight:700;color:var(--morado);font-size:13.5px}
/* tickets */
.tks{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:8px 0}
.tk{background:#fff;border:1px dashed #C9CFC5;border-radius:8px;padding:6px 7px;font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.5;opacity:0;transform:translateY(-12px) rotate(-2deg);transition:all .35s}
.tk.in{opacity:1;transform:none}
.tk b{display:block;font-family:Poppins;font-size:10.5px;color:var(--suave);border-bottom:1px dashed #DDD;margin-bottom:3px}
.tk span{display:block;border-radius:4px;padding:0 3px}
.hl-a{background:#FDEBD8}.hl-b{background:#DDF3F1}.hl-c{background:#EDE3FA}
.scan{height:4px;background:linear-gradient(90deg,transparent,var(--verde),transparent);border-radius:4px;animation:scan 1s linear infinite;margin:4px 0}
@keyframes scan{from{background-position:-300px 0}to{background-position:300px 0}}
.pq{display:flex;align-items:center;gap:10px;background:#F7F8FB;border-radius:12px;padding:8px 12px;margin-top:6px;font-weight:600}
.pq .big{font-size:26px}
.rule{display:inline-block;background:#EAF9EA;border:2px solid var(--verde);border-radius:10px;padding:4px 10px;font-weight:700;color:var(--verde-d);margin:3px 4px 3px 0;font-size:13px}
/* tienda */
.storewrap{display:grid;grid-template-columns:1fr 210px;gap:12px;margin-top:6px}
.store{position:relative;background:#F1EFE7;border-radius:14px;border:3px solid #C9C2AE;aspect-ratio:16/6.6;overflow:hidden}
.store canvas{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);width:17%;height:15%;border-radius:9px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;line-height:1.15;padding:2px;z-index:2;transition:all .2s}
.slot.fixed{background:#13294B;color:#fff}
.slot.free{background:rgba(255,255,255,.75);border:2px dashed #8A8F84;color:#6B7280;cursor:pointer}
.slot.free.hot{border-color:var(--morado);background:#EDE3FA;animation:hot 1s infinite}
@keyframes hot{50%{box-shadow:0 0 0 6px rgba(123,47,208,.25)}}
.slot.filled{border-style:solid;border-color:var(--morado);color:var(--tinta);background:#fff}
.slot.good{border-color:var(--verde);background:#EAF9EA}
.slot.badp{border-color:var(--rojo);background:#FDE8E8}
.lbl{position:absolute;font-size:11px;font-weight:800;color:#8A8270;letter-spacing:.05em;transform:translateX(-50%);z-index:1}
.bin{display:flex;flex-direction:column;gap:8px}
.prod{border:2px solid #D6DCD2;background:#fff;border-radius:12px;padding:9px 10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left;transition:all .15s}
.prod.pick{border-color:var(--morado);background:#EDE3FA}
.prod.used{opacity:.35;pointer-events:none}
.money{font-size:24px;font-weight:800;color:var(--verde-d);font-variant-numeric:tabular-nums}
.res{display:grid;gap:6px;margin-top:6px}
.res div{border-radius:10px;padding:7px 10px;font-size:13.5px}
.res .g{background:#E3F7E3;color:#145A14}.res .b{background:#FDE8E8;color:#8E1B1B}
.cmp{display:grid;gap:10px;margin:12px 0}
.cmp .r{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center;font-size:14px;font-weight:600}
.cmp .t{height:30px;background:#EEF1EC;border-radius:10px;overflow:hidden}
.cmp .t i{display:flex;align-items:center;justify-content:flex-end;padding-right:10px;height:100%;width:0;color:#fff;font-weight:800;border-radius:10px;transition:width 1.4s ease;white-space:nowrap}
.cert{border:4px solid var(--verde);border-radius:18px;padding:16px;text-align:center;background:linear-gradient(180deg,#fff,#F2FBF2)}
.cert .nm{font-size:25px;font-weight:800;color:var(--morado);margin:4px 0}
.cert .meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-size:13.5px;margin-top:8px}
.cert .meta span{background:#fff;border-radius:99px;padding:5px 11px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.share{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.share .btn{font-size:13.5px;padding:9px}
.wa{background:#25D366}.fb{background:#1877F2}.xx{background:#111}.cp{background:var(--turq)}.st{background:var(--rosa)}
.chat{margin-top:10px;font-weight:700;color:var(--verde-d);text-align:center}
footer{text-align:center;color:var(--suave);font-size:12.5px;margin:10px 0 6px}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:50}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:640px){
  body{font-size:14.5px}
  header .top{order:3;width:100%;flex-basis:100%}
  .tks{grid-template-columns:repeat(3,1fr)}
  .storewrap{grid-template-columns:1fr}
  .bin{flex-direction:row;flex-wrap:wrap}.prod{flex:1;min-width:30%;font-size:13px;text-align:center}
  .slot{font-size:9.5px;width:19%}
  .lbl{font-size:8.5px}
  .cmp .r{grid-template-columns:1fr}
  h1{font-size:21px}
}
</style>
</head>

<script>
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
let nombre = '', t0 = 0, tick = null, segundos = 0, ventasFinal = 0, intentos = 0;

/* ---------- sonido ---------- */
let ac;
function tono(f, d = .12, tipo = 'sine', v = .15, delay = 0) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = tipo; o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(ac.destination);
    const t = ac.currentTime + delay; o.start(t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.stop(t + d + .02);
  } catch (e) {}
}
const sOk = () => { tono(660); tono(880, .15, 'sine', .15, .1); };

const sCash = () => { tono(1200, .05, 'square', .05); tono(1600, .08, 'sine', .08, .05); };
const sTick = () => tono(900, .03, 'square', .03);

function confeti(n = 170) {
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#07B708', '#F07B00', '#D6338A', '#0E9C94', '#7B2FD0', '#E0A100', '#2E7DD7'];
  const vacio = !piezas.length;
  for (let i = 0; i < n; i++) piezas.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6, c: cols[i % cols.length], a: Math.random() * 6 });
  if (vacio) requestAnimationFrame(caer);
}
function caer() {
  cx.clearRect(0, 0, cv.width, cv.height);
  piezas.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-4, -2, 8 + p.r, 4); cx.restore(); });
  piezas = piezas.filter(p => p.y < cv.height + 20);
  if (piezas.length) requestAnimationFrame(caer); else cx.clearRect(0, 0, cv.width, cv.height);
}

/* ---------- utilidades ---------- */
function etapa(n) {
  $('#prog').style.width = (n / 4 * 100) + '%';
  document.querySelectorAll('#steps span').forEach((s, i) => s.className = i < n ? 'ok' : (i === n ? 'on' : ''));
}
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
function reloj() { segundos = Math.floor((Date.now() - t0) / 1000); $('#timer').textContent = '⏱️ ' + fmt(segundos); }
const pesos = n => '$' + Math.round(n).toLocaleString('es-MX');
const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const guia = t => `<div class="guia">👉 <b>Qué hacer:</b> ${t}</div>`;
function msg(el, tipo, txt) {
  el.className = 'msg ' + tipo;
  if (tipo === 'ojo') {
    const partes = txt.split('<br>');
    el.innerHTML = `<b>✖ Revisa tu respuesta.</b><div class="why">Recuerda: ${partes[0]}</div>` + (partes.length > 1 ? `<div style="margin-top:5px">${partes.slice(1).join('<br>')}</div>` : '');
    sErr(); const c = el.closest('.card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
  } else { el.innerHTML = txt; sOk(); }
  setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 60);
}
function elegir(cont, btn) {
  let v = null;
  cont.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    cont.querySelectorAll('.opt').forEach(x => x.classList.remove('pick'));
    b.classList.add('pick'); v = b.dataset.i; btn.disabled = false; tono(520, .05);
  });
  return () => v;
}

/* ---------- 2. Patrones ---------- */
let reglas = [];
function patron(k) {
  etapa(1);
  if (k === 0) reglas = [];
  const P = PATRONES[k];
  const ops = [P.par, ...P.otros].sort(() => Math.random() - .5);
  app.innerHTML = `
  <section class="card">
    <span class="mis" style="color:var(--rosa)">Paso 2 · Descubre patrones (${k + 1} de 3)</span>
    <h2>¿Qué compra quien lleva ${P.ancla}?</h2>
    <div class="tks" style="grid-template-columns:repeat(6,1fr)">${TICKETS.filter(t => t.includes(P.ancla)).slice(0, 6).map((t, i) => `<div class="tk in"><b>Ticket</b>${t.map(p => `<span class="${p === P.ancla ? P.cls : ''}">${esc(p)}</span>`).join('')}</div>`).join('')}</div>
    ${guia(`Revisa los tickets que tienen <b>${P.ancla}</b>, elige el producto que más se repite con él y presiona <b>«Confirmar patrón»</b>.`)}
    <div class="pq"><span class="big">${P.emo}</span><span>Si un cliente compra <b>${P.ancla}</b>, también compra…</span></div>
    <div class="opts" id="op">${ops.map(o => `<button class="opt" data-i="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div class="row"><button class="btn" id="cf" disabled>Confirmar patrón</button></div>
    <div class="msg" id="m"></div>
    ${reglas.length ? `<p style="margin-top:8px"><b>Reglas descubiertas:</b><br>${reglas.map(r => `<span class="rule">${r}</span>`).join('')}</p>` : ''}
  </section>`;
  const m = $('#m'), val = elegir($('#op'), $('#cf'));
  $('#cf').onclick = () => {
    const v = val();
    if (v !== P.par) return msg(m, 'ojo', `${v} casi no aparece en los tickets con ${P.ancla}. Fíjate qué producto se repite en la mayoría.<br>Elige otra opción y presiona «Confirmar patrón».`);
    app.querySelector('#op .pick').classList.add('sel'); app.querySelectorAll('#op .opt').forEach(x => x.style.pointerEvents = 'none'); $('#cf').style.display = 'none';
    reglas.push(`${P.emo} ${P.ancla} → ${P.par} (${P.pct}%)`);
    const ult = k === PATRONES.length - 1;
    msg(m, 'bien', `✅ ¡Patrón encontrado! En el <b>${P.pct}%</b> de los tickets con ${P.ancla} también hay ${P.par}.<div class="why" style="color:#2F6B2F">Dato curioso: ${P.why}</div><div class="row"><button class="btn" id="nx">${ult ? 'Siguiente: paso 3, Acomoda los anaqueles ➜' : 'Siguiente patrón ➜'}</button></div>`);
    $('#nx').onclick = () => ult ? acomodar() : patron(k + 1);
  };
}

/* ---------- 3. Acomodar ---------- */
// Coordenadas en % del plano (x, y)
const SLOTS = {
  A1: { x: 18, y: 30, fixed: 'Espagueti', pas: 'A' }, A2: { x: 18, y: 55, pas: 'A' },
  B1: { x: 50, y: 30, fixed: 'Pañales', pas: 'B' }, B2: { x: 50, y: 55, pas: 'B' },
  C1: { x: 82, y: 30, fixed: 'Pantalla 50"', pas: 'C' }, C2: { x: 82, y: 55, pas: 'C' },
  F1: { x: 14, y: 82, pas: 'F' }, F2: { x: 86, y: 82, pas: 'F' },
};
const CORRECTO = { 'Puré de tomate': 'A2', 'Café': 'B2', 'Soporte de pared': 'C2' };
let acomodo = {};
function acomodar() {
  etapa(2);
  acomodo = {};
  app.innerHTML = `

        <p style="font-size:12.5px;color:var(--suave);margin:2px 0"><b>Tus reglas:</b><br>${reglas.join('<br>')}</p>
      </div>
    </div>

  pintarTienda();
  let sel = null;
  app.querySelectorAll('.prod').forEach(b => b.onclick = () => {

    app.querySelectorAll('.slot.free:not(.filled)').forEach(s => s.classList.add('hot'));
  });
  app.querySelectorAll('.slot.free').forEach(s => s.onclick = () => {
    const id = s.dataset.id;
    if (acomodo[id]) { // quitar
      const p = acomodo[id]; delete acomodo[id]; s.classList.remove('filled'); s.textContent = 'Vacío';
      app.querySelector(`.prod[data-p="${CSS.escape(p)}"]`).classList.remove('used'); actualizar(); return;
    }
    if (!sel) return msg($('#m'), 'ojo', 'primero toca un producto de la lista y después el espacio vacío donde lo quieres poner.');
    acomodo[id] = sel; s.classList.add('filled'); s.textContent = sel; tono(700, .06);
    const b = app.querySelector(`.prod[data-p="${CSS.escape(sel)}"]`); b.classList.add('used'); b.classList.remove('pick'); sel = null;
    app.querySelectorAll('.slot').forEach(x => x.classList.remove('hot')); $('#m').className = 'msg'; actualizar();
  });
  function actualizar() {
    const n = Object.keys(acomodo).length;
    $('#cc').textContent = `Acomodados: ${n} de 3` + (n ? '  ·  toca un producto puesto para quitarlo' : '');
    $('#ab').disabled = n < 3;

  $('#ab').onclick = abrir;
}
function pintarTienda() {
  const st = $('#store');
  st.querySelectorAll('.slot,.lbl').forEach(e => e.remove());
  [['PASILLO 1', 18], ['PASILLO 2', 50], ['PASILLO 3', 82]].forEach(([t, x]) => { const l = document.createElement('div'); l.className = 'lbl'; l.style.left = x + '%'; l.style.top = '9%'; l.textContent = t; st.appendChild(l); });
  const e = document.createElement('div'); e.className = 'lbl'; e.style.left = '50%'; e.style.top = '93%'; e.textContent = '⬆ ENTRADA'; st.appendChild(e);
  for (const [id, s] of Object.entries(SLOTS)) {
    const d = document.createElement('div');
    d.className = 'slot ' + (s.fixed ? 'fixed' : 'free'); d.dataset.id = id;
    d.style.left = s.x + '%'; d.style.top = s.y + '%';
    d.textContent = s.fixed || (acomodo[id] || (s.pas === 'F' ? 'Vacío (fondo)' : 'Vacío'));
    if (acomodo[id]) d.classList.add('filled');
    st.appendChild(d);
  }
  dibujarPiso();
}
function dibujarPiso() {
  const c = $('#cv'), st = $('#store'); if (!c) return;
  const r = st.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const W = r.width, H = r.height;
  g.fillStyle = '#F1EFE7'; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(0,0,0,.05)'; g.lineWidth = 1;
  for (let x = 0; x < W; x += 24) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y < H; y += 24) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  // estantes (líneas grises a los lados de cada pasillo)
  g.fillStyle = '#D9D2BF';
  [18, 50, 82].forEach(px => { const x = px / 100 * W; g.fillRect(x - W * .11, H * .17, 6, H * .5); g.fillRect(x + W * .11 - 6, H * .17, 6, H * .5); });
  // entrada
  g.fillStyle = '#07B708'; g.fillRect(W * .42, H - 6, W * .16, 6);
}
window.addEventListener('resize', () => { if ($('#store')) dibujarPiso(); });

/* ---------- 4. Abrir la tienda (simulación) ---------- */
function abrir() {
  etapa(3); intentos++;
  $('#ab').disabled = true; app.querySelectorAll('.prod,.slot').forEach(x => x.style.pointerEvents = 'none');
  const gu = app.querySelector('.guia'); if (gu) gu.style.display = 'none';
  app.querySelectorAll('.bin p').forEach(x => x.style.display = 'none');
  const m = $('#m'); m.className = 'msg';
  const st = $('#store'), c = $('#cv');
  // ¿qué pares están bien?
  const bien = {}; for (const [p, slot] of Object.entries(CORRECTO)) bien[p] = acomodo[slot] === p;
  const anclaPar = { A: 'Puré de tomate', B: 'Café', C: 'Soporte de pared' };
  const precio = { A: [38, 22], B: [420, 95], C: [8999, 650] };
  const r = st.getBoundingClientRect(), W = r.width, H = r.height;
  const ent = { x: .5 * W, y: .97 * H };
  const clientes = []; const total = 18;
  for (let i = 0; i < total; i++) {
    const pas = ['A', 'B', 'C'][i % 3];
    const ax = SLOTS[pas + '1'].x / 100 * W, ay = SLOTS[pas + '1'].y / 100 * H;
    const bx = SLOTS[pas + '2'].x / 100 * W, by = SLOTS[pas + '2'].y / 100 * H;
    const compra = bien[anclaPar[pas]] ? Math.random() < .85 : Math.random() < .15;
    clientes.push({ pas, t: -i * 0.33, ruta: [ent, { x: ax, y: ay + H * .12 }, { x: bx + (Math.random() - .5) * 20, y: by }, ent], compra, hecho: false, c: ['#F07B00', '#D6338A', '#0E9C94', '#2E7DD7', '#7B2FD0'][i % 5] });
  }
  let ventas = 0, ventasSin = 0, parCon = 0, flot = [];
  clientes.forEach(k => { ventasSin += precio[k.pas][1] * .15; });
  const g = c.getContext('2d'); const dpr = window.devicePixelRatio || 1;
  const ini = performance.now(); let last = ini;
  $('#cc').innerHTML = `Ventas: <span class="money" id="mv">$0</span>`;
  function pos(k) {
    const segs = k.ruta.length - 1, tt = Math.max(0, Math.min(k.t, segs)), i = Math.min(Math.floor(tt), segs - 1), f = tt - i;
    const a = k.ruta[i], b = k.ruta[i + 1]; return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, seg: i, f };
  }
  function frame(now) {
    const dt = (now - last) / 1000; last = now;
    if (!$('#cv')) return;
    g.setTransform(dpr, 0, 0, dpr, 0, 0); dibujarPisoSolo(g, W, H);
    let vivos = 0;
    clientes.forEach(k => {
      k.t += dt * 0.9; if (k.t < 0) return;
      if (k.t >= k.ruta.length - 1) return; vivos++;
      const p = pos(k);
      if (p.seg === 1 && !k.ancla) { k.ancla = true; ventas += precio[k.pas][0]; flot.push({ x: p.x, y: p.y - 10, t: 0, txt: '+' + pesos(precio[k.pas][0]), c: '#058A06' }); sCash(); }
      if (p.seg === 2 && !k.hecho) {
        k.hecho = true;
        if (k.compra) { ventas += precio[k.pas][1]; parCon += precio[k.pas][1]; flot.push({ x: p.x, y: p.y - 10, t: 0, txt: '+' + pesos(precio[k.pas][1]) + ' ' + anclaPar[k.pas].split(' ')[0], c: '#7B2FD0' }); sCash(); }
        else flot.push({ x: p.x, y: p.y - 10, t: 0, txt: '¿' + anclaPar[k.pas].split(' ')[0] + '?', c: '#D62828' });
      }
      g.fillStyle = k.c; g.beginPath(); g.arc(p.x, p.y, 8, 0, 7); g.fill();
      g.font = '13px serif'; g.fillText('🛒', p.x + 6, p.y + 4);
    });
    flot = flot.filter(f => f.t < 1.4);
    flot.forEach(f => { f.t += dt; g.globalAlpha = 1 - f.t / 1.4; g.fillStyle = f.c; g.font = 'bold 12px Poppins, sans-serif'; g.fillText(f.txt, f.x - 20, f.y - f.t * 26); g.globalAlpha = 1; });
    const mv = $('#mv'); if (mv) mv.textContent = pesos(ventas);
    if (vivos > 0 || now - ini < 1500 || flot.length) requestAnimationFrame(frame);
    else terminar(ventas, ventasSin, parCon);
  }
  requestAnimationFrame(frame);
  function terminar(v, vs, pc) {
    dibujarPiso();
    const malos = Object.keys(CORRECTO).filter(p => !bien[p]);
    app.querySelectorAll('.slot.filled').forEach(s => s.classList.add(acomodo[s.dataset.id] && CORRECTO[acomodo[s.dataset.id]] === s.dataset.id ? 'good' : 'badp'));
    if (malos.length) {
      const motivo = {
        'Puré de tomate': 'el puré de tomate se compra con el espagueti. Si no está en el pasillo 1, junto al espagueti, el cliente no lo ve y se va sin él.',
        'Café': 'el patrón dice que quien compra pañales se lleva café. Ponlo en el pasillo 2, junto a los pañales.',
        'Soporte de pared': 'quien compra una pantalla necesita el soporte. Si está lejos del pasillo 3, el cliente no lo encuentra.',
      };
      msg(m, 'ojo', malos.map(p => motivo[p]).join(' ') + `<br>Vendiste <b>${pesos(v)}</b>. Los clientes con ❓ pasaron de largo porque el producto no estaba donde lo buscaban.<div class="row"><button class="btn" id="re">🔁 Reacomodar y volver a abrir</button></div>`);
      $('#re').onclick = acomodar;
    } else {
      ventasFinal = v;
      msg(m, 'bien', `✅ ¡Tienda acomodada con minería de datos! Vendiste <b>${pesos(v)}</b>: casi todos los clientes encontraron el producto que suelen llevar juntos.<div class="row"><button class="btn" id="nx">Ver resultados ➜</button></div>`);
      $('#nx').onclick = () => resultado(pc, vs);
    }
  }
}
function dibujarPisoSolo(g, W, H) {
  g.fillStyle = '#F1EFE7'; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(0,0,0,.05)'; g.lineWidth = 1;
  for (let x = 0; x < W; x += 24) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y < H; y += 24) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.fillStyle = '#D9D2BF';
  [18, 50, 82].forEach(px => { const x = px / 100 * W; g.fillRect(x - W * .11, H * .17, 6, H * .5); g.fillRect(x + W * .11 - 6, H * .17, 6, H * .5); });
  g.fillStyle = '#07B708'; g.fillRect(W * .42, H - 6, W * .16, 6);
}

/* ---------- resultado ---------- */
function resultado(v, vs) {
  clearInterval(tick); reloj(); etapa(4);
  const escala = 400; // de 18 clientes a un día de diciembre en las 12 tiendas
  const con = Math.round(v * escala / 1000) * 1000, sin = Math.round(vs * escala / 1000) * 1000;
  ventasFinal = con;
  app.innerHTML = `
  <section class="card">
    <h2>📈 Diciembre en Súper Del Valle</h2>
    <p>Ventas extra de los productos que se compran juntos (puré de tomate, café y soporte de pared) en un día de diciembre, en las 12 tiendas:</p>
    <div class="cmp">
      <div class="r"><span>😐 Anaqueles "a ojo"</span><div class="t"><i style="background:#9CA3AF">${pesos(sin)}</i></div></div>
      <div class="r"><span>⛏️ Con minería de datos</span><div class="t"><i style="background:var(--verde)">${pesos(con)}</i></div></div>
    </div>
    <p><b>Tus reglas de asociación:</b><br>${reglas.map(r => `<span class="rule">${r}</span>`).join('')}</p>
    <div class="story" style="background:#EDE3FA;border-color:var(--morado)">Los datos siempre estuvieron ahí. La <b>minería de datos</b> encontró los patrones y la <b>inteligencia de negocios</b> los convirtió en una decisión: dónde poner cada producto.</div>
    <div class="row"><button class="btn" id="nx">Ver mi certificado ➜</button></div>
  </section>`;
  const top = Math.max(con, sin);
  setTimeout(() => { const b = app.querySelectorAll('.cmp i'); b[0].style.width = (sin / top * 100) + '%'; b[1].style.width = (con / top * 100) + '%'; }, 80);
  sWin(); confeti();
  $('#nx').onclick = certificado;
}

function historia(tiempo, fecha) {
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1920;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 1080, 1920); g.addColorStop(0, '#0E5E58'); g.addColorStop(1, '#2B0F55');
  x.fillStyle = g; x.fillRect(0, 0, 1080, 1920);
  const cols = ['#07B708', '#F07B00', '#D6338A', '#0E9C94', '#7B2FD0', '#E0A100'];
  for (let i = 0; i < 90; i++) { x.fillStyle = cols[i % 6]; x.globalAlpha = .5; x.fillRect(Math.random() * 1080, Math.random() * 1920, 14, 6); }
  x.globalAlpha = 1; x.fillStyle = '#fff';
  if (x.roundRect) { x.beginPath(); x.roundRect(90, 380, 900, 1200, 50); x.fill(); } else x.fillRect(90, 380, 900, 1200);
  x.textAlign = 'center';
  x.font = '160px serif'; x.fillText('⛏️', 540, 600);
  x.fillStyle = '#058A06'; x.font = '800 44px Poppins, sans-serif'; x.fillText('CERTIFICADO', 540, 700);
  x.fillStyle = '#1F2433'; x.font = '700 58px Poppins, sans-serif'; x.fillText('Analista de', 540, 790); x.fillText('minería de datos', 540, 860);
  x.fillStyle = '#7B2FD0'; x.font = '800 64px Poppins, sans-serif'; x.fillText(nombre.length > 22 ? nombre.slice(0, 22) + '…' : nombre, 540, 990);
  x.fillStyle = '#1F2433'; x.font = '500 44px Poppins, sans-serif';
  x.fillText('🔎 3 patrones descubiertos', 540, 1100);
  x.fillText('⏱️ ' + tiempo + '   ·   Semana 4', 540, 1180); x.fillText(fecha, 540, 1250);
  x.font = '700 40px Poppins, sans-serif'; x.fillText('Docente: Dr. Armando Maravilla', 540, 1350);
  x.fillStyle = '#fff'; x.font = '700 50px Poppins, sans-serif'; x.fillText('El anaquel inteligente · UTEL', 540, 1700);
  const img = new Image(); img.onload = () => { x.drawImage(img, 540 - 180, 1390, 360, 144); const a = document.createElement('a'); a.download = 'certificado-semana4.png'; a.href = c.toDataURL('image/png'); a.click(); };
  img.src = document.querySelector('header img').src;
}
